services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data, ../../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro]
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://ats:ats@db:5432/ats
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  db_data:
