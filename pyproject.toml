[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-trading-system"
version = "0.1.0"
description = "Evidence-driven Indian market research and trading platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "psycopg[binary]>=3.2", "httpx2>=0.1"]

[tool.setuptools.packages.find]
include = ["packages*", "apps*", "research*"]
exclude = ["infra*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
