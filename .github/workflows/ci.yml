name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ats
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats -d ats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ats:ats@localhost:5432/ats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx2
      - name: Run tests
        run: python -m pytest -q
