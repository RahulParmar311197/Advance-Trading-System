name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ats
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats -d ats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ats:ats@localhost:5432/ats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx2
      - name: Run tests
        run: python -m pytest -q
      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: ats
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql://ats:ci-only-password@db:5432/ats
          REDIS_URL: redis://redis:6379/0
          QUEUE_NAME: default
          CODE_VERSION: ci-${{ github.sha }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: docker compose -f infra/deployment/docker-compose.production.yml config --quiet
      - name: Validate production environment boundary
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql://ats:ci-only-password@db:5432/ats
          REDIS_URL: redis://redis:6379/0
          QUEUE_NAME: default
          CODE_VERSION: ci-${{ github.sha }}
        run: python scripts/validate_deployment.py
